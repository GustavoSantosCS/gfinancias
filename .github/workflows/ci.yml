name: Continuous Integration

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: file:///tmp/gfinancias-ci.db
      CORS_ORIGIN: http://localhost:3001
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting, lint, and types
        run: npm run check
      - name: Run repository guards
        run: npm run guard -- --base ${{ github.event.pull_request.base.sha }} --format github --checks explicit-any,architecture,test-hygiene,financial-conventions,test-companion,complexity,contract-regression,coverage-policy
      - name: Run tests and compare coverage
        run: npm run guard:coverage:full -- --base ${{ github.event.pull_request.base.sha }} --format github
      - name: Build applications
        run: npm run build
      - name: Apply database migrations
        run: mkdir -p .tmp && DATABASE_URL=file:../../.tmp/gfinancias-e2e.db npm run db:migrate:deploy
      - name: Install Playwright Chromium
        run: npm run test:e2e:install -- --with-deps
      - name: Run end-to-end tests
        run: npm run test:e2e
      - name: Build Storybook
        run: npm run build-storybook
